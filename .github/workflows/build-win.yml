name: Build Windows

# Builds the Windows NSIS installer on GitHub's own Windows runner, so a
# release no longer depends on someone running `npm run dist` locally.
#
# latest.yml matters as much as the .exe: electron-updater reads it to decide
# whether an update exists, so a release without it is invisible to every
# Windows user already running the app.
#
# - Push a tag matching v* : builds and attaches the installer to that GitHub
#   release (creating it if it doesn't exist yet).
# - Manual "Run workflow" with a `tag` input: builds THAT tag and attaches to
#   its release. This is the way to fill in a release that was tagged before
#   this workflow existed — dispatching against the tag ref itself can't work,
#   since the workflow file isn't present in that commit.
# - Manual "Run workflow" with no input: builds the current branch and uploads
#   the result as a downloadable Actions artifact, for testing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (e.g. v3.5.0). Leave empty to just build this branch.'
        required: false
        default: ''

# The default GITHUB_TOKEN is read-only unless a workflow explicitly asks
# for more — without this, attaching files to a release gets a 403.
permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the requested tag when one is given, otherwise whatever ref
          # triggered this run.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # --publish never: build only. electron-builder auto-detects the tag and
      # otherwise tries to publish the release itself (needs its own GH_TOKEN)
      # — we attach the assets ourselves in the next step.
      - run: npm run dist -- --win --publish never

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # Empty on a tag push, where the action falls back to the pushed tag.
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event.inputs.tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: promptpad-windows
          path: |
            release/*.exe
            release/latest.yml
